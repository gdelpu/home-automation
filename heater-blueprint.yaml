
blueprint:
  name: Fil pilote — Schedule (données avancées) + Inhibition porte
  description: >
    Lit le mode voulu depuis l'attribut 'fil_pilote_mode' du Schedule actif (Additional data).
    Si l'attribut est absent, applique un mode par défaut. Coupe le chauffage si la porte
    reste ouverte > délai, et rétablit le mode à la fermeture.
  domain: automation
  source_url: https://example.local/blueprints/fil_pilote_schedule_attr_inhibition.yaml

  input:
    door_sensor:
      name: Capteur de porte
      description: Binary sensor (on = ouvert, off = fermé)
      selector:
        entity:
          domain: binary_sensor

    fil_pilote_select:
      name: Select du fil pilote (Nodon SIN-4-FP-21)
      selector:
        entity:
          domain: select

    schedule_entity:
      name: Schedule unique
      description: Helper Schedule dont chaque plage peut porter 'fil_pilote_mode'
      selector:
        entity:
          domain: schedule

    open_delay_minutes:
      name: Délai d'ouverture avant coupure
      default: 2
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: slider

    default_mode_when_unspecified:
      name: Mode par défaut si la plage n'a pas 'fil_pilote_mode'
      description: Ex. Comfort
      default: "Comfort"
      selector:
        text:

    off_mode_during_open:
      name: Mode forcé quand porte ouverte > délai
      description: Ex. Off
      default: "Off"
      selector:
        text:

variables:
  door_sensor: !input door_sensor
  fil_pilote_select: !input fil_pilote_select
  schedule_entity: !input schedule_entity
  open_delay_minutes: !input open_delay_minutes
  default_mode_when_unspecified: !input default_mode_when_unspecified
  off_mode_during_open: !input off_mode_during_open

  # Mode "voulu" : attribut 'fil_pilote_mode' du Schedule si présent, sinon défaut.
  wanted_mode: >
    {% set mode_attr = state_attr(schedule_entity, 'fil_pilote_mode') %}
    {{ (mode_attr if mode_attr is string and mode_attr|length > 0 else default_mode_when_unspecified) }}


  # Inhibition (helper)
  inhibition_helper: input_boolean.sdb_inhibition_porte

trigger:
  - id: schedule_changed
    platform: state
    entity_id: !input schedule_entity
  - id: door_open_long
    platform: state
    entity_id: !input door_sensor
    to: "on"
    for:
      minutes: !input open_delay_minutes
  - id: door_closed
    platform: state
    entity_id: !input door_sensor
    to: "off"
  - id: ha_start
    platform: homeassistant
    event: start
  - id: automations_reloaded
    platform: event
    event_type: automation_reloaded

condition: []

action:
  - choose:
      # 1) Porte ouverte > délai -> forcer le mode d'ouverture (Off par défaut)
      - conditions:
          - condition: trigger
            id: door_open_long
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: "{{ inhibition_helper }}"
          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: "{{ off_mode_during_open }}"

          # (facultatif) log
          - service: persistent_notification.create
            data:
              title: "Inhibition porte ouverte"
              message: "Porte ouverte > {{ open_delay_minutes }} min → fil pilote: {{ off_mode_during_open }}"
              notification_id: "sdb_fp_inhibition"


      # 2) Porte refermée -> réappliquer le mode voulu (fil_pilote_mode ou défaut)

      - conditions:
          - condition: trigger
            id: door_closed
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: "{{ inhibition_helper }}"

          # Petit délai pour laisser HA stabiliser l'état/attributs du Schedule
          - delay:
              seconds: 1.5

          # Double vérification : si le schedule est 'on', on relit l'attribut; sinon, on applique le mode défaut
          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: >
                {% if is_state(schedule_entity, 'on') %}
                  {{ wanted_mode }}
                {% else %}
                  {{ default_mode_when_unspecified }}
                {% endif %}

          # (facultatif) log
          - service: persistent_notification.create
            data:
              title: "Fin inhibition, porte fermée"
              message: >
                Schedule={{ states(schedule_entity) }} | mode voulu={{ wanted_mode }} |
                mode appliqué={{ 'wanted_mode' if is_state(schedule_entity,'on') else default_mode_when_unspecified }}
              notification_id: "sdb_fp_inhibition"

      # 3) Schedule change / démarrage / reload -> appliquer le mode voulu
      #    ... sauf si la porte est déjà ouverte au-delà du délai.
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: schedule_changed
              - condition: trigger
                id: ha_start
              - condition: trigger
                id: automations_reloaded
          - condition: state
            entity_id: "{{ inhibition_helper }}"
            state: "off"
          - condition: template
            value_template: >
              {% set is_open = is_state(door_sensor, 'on') %}
              {% if not is_open %}
                true
              {% else %}
                {% set since = (now() - states[door_sensor].last_changed).total_seconds() | int %}
                {{ since < (open_delay_minutes | int * 60) }}
              {% endif %}
        sequence:
          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: "{{ wanted_mode }}"
    default: []

mode: restart
