
blueprint:
  name: Fil pilote SDB — Planification + Inhibition porte
  description: >
    Applique un mode de fil pilote selon un Schedule (ON/OFF) et coupe le chauffage
    si la porte reste ouverte plus de X minutes. À la fermeture, le mode est rétabli
    selon l'état du Schedule.
  domain: automation
  source_url: https://example.local/blueprints/fil-pilote-sdb-planif-inhibition.yaml
  input:
    door_sensor:
      name: Capteur de porte
      description: Binary sensor (on = ouvert, off = fermé)
      selector:
        entity:
          domain: binary_sensor
    fil_pilote_select:
      name: Select fil pilote Nodon
      description: Entité select du module SIN-4-FP-21
      selector:
        entity:
          domain: select
    schedule_entity:
      name: Schedule (helper)
      description: Entité du helper 'Schedule' qui bascule ON/OFF selon les créneaux
      selector:
        entity:
          domain: schedule
    open_delay_minutes:
      name: Délai d'ouverture avant coupure
      description: Minutes d'ouverture continue de la porte avant de couper (anti-flapping)
      default: 2
      selector:
        number:
          min: 1
          max: 30
          step: 1
          mode: slider
    mode_when_on:
      name: Mode quand Schedule = ON
      description: Option exacte du select (ex. Comfort)
      default: Comfort
      selector:
        select:
          options:
            - Comfort
            - Eco
            - Off
            - FrostProtection
            - ComfortMinus1
            - ComfortMinus2
    mode_when_off:
      name: Mode quand Schedule = OFF
      description: Option exacte du select (ex. Eco)
      default: Eco
      selector:
        select:
          options:
            - Comfort
            - Eco
            - Off
            - FrostProtection
            - ComfortMinus1
            - ComfortMinus2
    off_mode_during_open:
      name: Mode forcé quand porte ouverte > délai
      description: Option exacte du select (ex. Off)
      default: Off
      selector:
        select:
          options:
            - Off
            - Eco
            - Comfort
            - FrostProtection
            - ComfortMinus1
            - ComfortMinus2

variables:
  door_sensor: !input door_sensor
  fil_pilote_select: !input fil_pilote_select
  schedule_entity: !input schedule_entity
  open_delay_minutes: !input open_delay_minutes
  mode_when_on: !input mode_when_on
  mode_when_off: !input mode_when_off
  off_mode_during_open: !input off_mode_during_open

# ⚙️ Automatisation 1 — Appliquer le mode du Schedule (si pas d'ouverture prolongée)
trigger:
  - platform: state
    entity_id: !input schedule_entity
  - platform: homeassistant
    event: start
  - platform: event
    event_type: automation_reloaded

condition:
  # Si la porte est ouverte, on vérifie qu'elle ne l'est PAS depuis plus que le délai autorisé.
  - condition: template
    value_template: >
      {% set is_open = is_state(door_sensor, 'on') %}
      {% set open_for = (as_timestamp(now()) - as_timestamp(states[door_sensor].last_changed)) %}
      {% if not is_open %}
        true
      {% else %}
        {{ open_for < (open_delay_minutes | int * 60) }}
      {% endif %}

action:
  - choose:
      - conditions:
          - condition: state
            entity_id: !input schedule_entity
            state: "on"
        sequence:
          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: "{{ mode_when_on }}"
      - conditions:
          - condition: state
            entity_id: !input schedule_entity
            state: "off"
        sequence:
          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: "{{ mode_when_off }}"
    default: []
mode: restart

# ⚙️ Automatisation 2 — Porte ouverte > délai → couper (off_mode_during_open)
# On crée une seconde sequence via "parallel" pour porter les deux workflows dans un blueprint.
# Home Assistant n'autorise pas deux blocs 'automation' dans un même blueprint, donc on fait des triggers multiples.
# NB: L'action suivante ne s'exécute que sur état 'on' pendant le délai spécifié.
trigger:
  - platform: state
    entity_id: !input door_sensor
    to: "on"
    for:
      minutes: !input open_delay_minutes

condition: []
action:
  - service: select.select_option
    target:
      entity_id: !input fil_pilote_select
    data:
      option: "{{ off_mode_during_open }}"
mode: restart

# ⚙️ Automatisation 3 — Porte refermée → rétablir le mode du Schedule
trigger:
  - platform: state
    entity_id: !input door_sensor
    to: "off"

condition: []
action:
  - choose:
      - conditions:
          - condition: state
            entity_id: !input schedule_entity
            state: "on"
        sequence:
          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: "{{ mode_when_on }}"
      - conditions:
          - condition: state
            entity_id: !input schedule_entity
            state: "off"
        sequence:
          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: "{{ mode_when_off }}"
    default: []
mode: restart
