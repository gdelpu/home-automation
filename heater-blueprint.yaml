
blueprint:
  name: Fil pilote — Schedule (données avancées) + Inhibition porte
  description: >
    Lit le mode voulu depuis l'attribut 'fil_pilote_mode' du Schedule actif (Additional data).
    Si l'attribut est absent, applique un mode par défaut. Coupe le chauffage si la porte
    reste ouverte > délai, et rétablit le mode à la fermeture, en tenant compte d'une
    inhibition explicite via input_boolean.
  domain: automation
  source_url: https://example.local/blueprints/fil_pilote_schedule_attr_inhibition.yaml

  input:
    door_sensor:
      name: Capteur de porte
      selector:
        entity:
          domain: binary_sensor

    fil_pilote_select:
      name: Select du fil pilote (Nodon SIN-4-FP-21)
      selector:
        entity:
          domain: select

    schedule_entity:
      name: Schedule unique
      selector:
        entity:
          domain: schedule

    open_delay_minutes:
      name: Délai d'ouverture avant coupure
      default: 2
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: slider

    default_mode_when_unspecified:
      name: Mode par défaut si la plage n'a pas 'fil_pilote_mode'
      default: "Comfort"
      selector:
        text:

    off_mode_during_open:
      name: Mode forcé quand porte ouverte > délai
      default: "Off"
      selector:
        text:

    inhibition_helper:
      name: Interrupteur d'inhibition (porte ouverte prolongée)
      description: Sélectionne l'input_boolean d'inhibition (ex. input_boolean.sdb_inhibition_porte)
      selector:
        entity:
          domain: input_boolean

    away_selector:
      name: Sélecteur de mode (présence/absence)
      description: input_select dont la valeur "away" force le fil pilote à Off
      selector:
        entity:
          domain: input_select          

variables:
  door_sensor: !input door_sensor
  fil_pilote_select: !input fil_pilote_select
  schedule_entity: !input schedule_entity
  open_delay_minutes: !input open_delay_minutes
  default_mode_when_unspecified: !input default_mode_when_unspecified
  off_mode_during_open: !input off_mode_during_open
  inhibition_helper: !input inhibition_helper

  # Mode "voulu" : attribut 'fil_pilote_mode' du Schedule si présent, sinon défaut.
  wanted_mode: >
    {% set mode_attr = state_attr(schedule_entity, 'fil_pilote_mode') %}
    {{ (mode_attr if mode_attr is string and mode_attr|length > 0 else default_mode_when_unspecified) }}


  away_selector: !input away_selector

  # "away" actif ?
  away_active: >
    {{ is_state(away_selector, 'away') }}
    

trigger:
  - id: schedule_changed
    platform: state
    entity_id: !input schedule_entity
  - id: door_open_long
    platform: state
    entity_id: !input door_sensor
    to: "on"
    for:
      minutes: !input open_delay_minutes
  - id: door_closed
    platform: state
    entity_id: !input door_sensor
    to: "off"
  - id: ha_start
    platform: homeassistant
    event: start
  - id: automations_reloaded
    platform: event
    event_type: automation_reloaded
  - id: away_changed
    platform: state
    entity_id: !input away_selector
    

condition: []

action:
  - choose:

      # 0) Priorité absolue: mode "away" -> fil pilote Off
      - conditions:
          - condition: template
            value_template: "{{ away_active }}"
        sequence:
          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: "Off"
          - service: persistent_notification.create
            data:
              title: "Absence (away) active"
              message: "input_select.mode = away → fil pilote forcé à Off"
              notification_id: "sdb_fp_away"
  
      # 1) Porte ouverte > délai -> activer inhibition + appliquer mode coupure
      - conditions:
          - condition: trigger
            id: door_open_long
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: !input inhibition_helper
          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: "{{ off_mode_during_open }}"
          - service: persistent_notification.create
            data:
              title: "Inhibition porte ouverte"
              message: "Porte ouverte > {{ open_delay_minutes }} min → fil pilote: {{ off_mode_during_open }}"
              notification_id: "sdb_fp_inhibition"

      # 2) Porte refermée -> désactiver inhibition + réappliquer le mode voulu
      - conditions:
          - condition: trigger
            id: door_closed
          - condition: template
            value_template: "{{ not away_active }}"
            
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: !input inhibition_helper

          # Petit délai pour laisser HA stabiliser l'état/attributs du Schedule
          - delay:
              seconds: 1.5

          # Si le schedule est 'on', on relit l'attribut; sinon, on applique le mode défaut
          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: >
                {% if is_state(schedule_entity, 'on') %}
                  {{ wanted_mode }}
                {% else %}
                  {{ default_mode_when_unspecified }}
                {% endif %}

          - service: persistent_notification.create
            data:
              title: "Fin inhibition, porte fermée"
              message: >
                Schedule={{ states(schedule_entity) }} | mode voulu={{ wanted_mode }}
              notification_id: "sdb_fp_inhibition"

      # 3) Schedule change / démarrage / reload -> appliquer le mode voulu
      #    ... uniquement si pas d'inhibition ET si la porte n'est pas ouverte au-delà du délai.
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: schedule_changed
              - condition: trigger
                id: ha_start
              - condition: trigger
                id: automations_reloaded

          # Ne pas écraser si inhibition active
          - condition: state
            entity_id: !input inhibition_helper
            state: "off"

          # Si porte ouverte, ne pas appliquer si elle l'est depuis plus que le délai
          - condition: template
            value_template: >
              {% set is_open = is_state(door_sensor, 'on') %}
              {% if not is_open %}
                true
              {% else %}
                {% set since = (now() - states[door_sensor].last_changed).total_seconds() | int %}
                {{ since < (open_delay_minutes | int * 60) }}
              {% endif %}
          
          # Si mode "Away"
          - condition: template
            value_template: "{{ not away_active }}"
              
        sequence:
          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: "{{ wanted_mode }}"
    default: []

mode: restart
