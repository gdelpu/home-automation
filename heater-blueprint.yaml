
blueprint:
  name: Fil pilote — Schedule (données avancées) + Inhibition porte + Away
  description: >
    Lit le mode voulu depuis l'attribut 'fil_pilote_mode' du Schedule actif (Additional data).
    Si l'attribut est absent, applique un mode par défaut. Coupe le chauffage si la porte
    reste ouverte > délai, et rétablit le mode à la fermeture. Priorité "away" (input_select.mode=away)
    qui force Off. Les modes par défaut et d'ouverture sont sélectionnables via listes.
  domain: automation
  source_url: https://example.local/blueprints/fil_pilote_schedule_attr_inhibition.yaml

  input:
    door_sensor:
      name: Capteur de porte
      description: Binary sensor (on = ouvert, off = fermé)
      selector:
        entity:
          domain: binary_sensor

    fil_pilote_select:
      name: Select du fil pilote (Nodon SIN-4-FP-21)
      selector:
        entity:
          domain: select

    schedule_entity:
      name: Schedule unique
      description: Utilise 'fil_pilote_mode' en Additional data dans chaque plage active
      selector:
        entity:
          domain: schedule

    open_delay_minutes:
      name: Délai d'ouverture avant coupure
      description: Minutes d'ouverture continue avant inhibition
      default: 2
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: slider

    # Sélecteurs "liste déroulante" pour les modes
    default_mode_when_unspecified:
      name: Mode par défaut (si la plage n'indique pas 'fil_pilote_mode')
      description: Appliqué lorsque le Schedule est ON mais sans Additional data
      default: "Comfort"
      selector:
        select:
          options:
            - label: "Comfort"
              value: "Comfort"
            - label: "Eco"
              value: "Eco"
            - label: "Off"
              value: "Off"
            - label: "FrostProtection"
              value: "FrostProtection"
            - label: "ComfortMinus1"
              value: "ComfortMinus1"
            - label: "ComfortMinus2"
              value: "ComfortMinus2"

    off_mode_during_open:
      name: Mode forcé quand porte ouverte > délai
      description: Appliqué pendant l'inhibition porte
      default: "Off"
      selector:
        select:
          options:
            - label: "Off"
              value: "Off"
            - label: "Eco"
              value: "Eco"
            - label: "Comfort"
              value: "Comfort"
            - label: "FrostProtection"
              value: "FrostProtection"
            - label: "ComfortMinus1"
              value: "ComfortMinus1"
            - label: "ComfortMinus2"
              value: "ComfortMinus2"

    inhibition_helper:
      name: Interrupteur d'inhibition (porte ouverte prolongée)
      description: Sélectionner l'input_boolean utilisé par l'automatisation
      selector:
        entity:
          domain: input_boolean

    away_selector:
      name: Sélecteur de mode (présence/absence)
      description: input_select dont la valeur "away" force le fil pilote à Off
      selector:
        entity:
          domain: input_select

variables:
  door_sensor: !input door_sensor
  fil_pilote_select: !input fil_pilote_select
  schedule_entity: !input schedule_entity
  open_delay_minutes: !input open_delay_minutes
  default_mode_when_unspecified: !input default_mode_when_unspecified
  off_mode_during_open: !input off_mode_during_open
  inhibition_helper: !input inhibition_helper
  away_selector: !input away_selector

  # "away" actif ?
  away_active: >
    {{ is_state(away_selector, 'away') }}

  # Mode voulu : attribut 'fil_pilote_mode' du Schedule si présent, sinon défaut.
  wanted_mode: >
    {% set mode_attr = state_attr(schedule_entity, 'fil_pilote_mode') %}
    {{ (mode_attr if mode_attr is string and mode_attr|length > 0 else default_mode_when_unspecified) }}

trigger:
  - id: schedule_changed
    platform: state
    entity_id: !input schedule_entity

  - id: door_open_long
    platform: state
    entity_id: !input door_sensor
    to: "on"
    for:
      minutes: !input open_delay_minutes

  - id: door_closed
    platform: state
    entity_id: !input door_sensor
    to: "off"

  - id: away_changed
    platform: state
    entity_id: !input away_selector

  - id: ha_start
    platform: homeassistant
    event: start

  - id: automations_reloaded
    platform: event
    event_type: automation_reloaded

condition: []

action:
  - choose:
      # 0) Priorité absolue : "away" -> Off (et on ne laisse rien réécrire tant que away actif)
      - conditions:
          - condition: template
            value_template: "{{ away_active }}"
        sequence:
          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: "Off"
          - service: persistent_notification.create
            data:
              title: "Absence (away) active"
              message: "input_select.mode = away → fil pilote forcé à Off"
              notification_id: "sdb_fp_away"

      # 0-bis) Fin d'away -> réappliquer le mode voulu (si pas d'inhibition et pas ouverture prolongée)
      - conditions:
          - condition: trigger
            id: away_changed
          - condition: template
            value_template: "{{ not away_active }}"
          - condition: state
            entity_id: !input inhibition_helper
            state: "off"
          - condition: template
            value_template: >
              {% set is_open = is_state(door_sensor, 'on') %}
              {% if not is_open %}
                true
              {% else %}
                {% set since = (now() - states[door_sensor].last_changed).total_seconds() | int %}
                {{ since < (open_delay_minutes | int * 60) }}
              {% endif %}
        sequence:
          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: "{{ wanted_mode }}"

      # 1) Porte ouverte > délai -> activer inhibition + appliquer mode de coupure
      - conditions:
          - condition: trigger
            id: door_open_long
          - condition: template
            value_template: "{{ not away_active }}"
        sequence:
          - service: input_boolean.turn_on
            target:
              entity_id: !input inhibition_helper
          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: "{{ off_mode_during_open }}"
          - service: persistent_notification.create
            data:
              title: "Inhibition porte ouverte"
              message: "Porte ouverte > {{ open_delay_minutes }} min → fil pilote: {{ off_mode_during_open }}"
              notification_id: "sdb_fp_inhibition"

      # 2) Porte refermée -> désactiver inhibition + réappliquer le mode voulu
      - conditions:
          - condition: trigger
            id: door_closed
          - condition: template
            value_template: "{{ not away_active }}"
        sequence:
          - service: input_boolean.turn_off
            target:
              entity_id: !input inhibition_helper

          # Délai court pour stabiliser l'attribut du Schedule
          - delay:
              seconds: 1.5

          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: >
                {% if is_state(schedule_entity, 'on') %}
                  {{ wanted_mode }}
                {% else %}
                  {{ default_mode_when_unspecified }}
                {% endif %}

          - service: persistent_notification.create
            data:
              title: "Fin inhibition, porte fermée"
              message: "Schedule={{ states(schedule_entity) }} | mode voulu={{ wanted_mode }}"
              notification_id: "sdb_fp_inhibition"

      # 3) Schedule change / démarrage / reload -> appliquer le mode voulu
      #    ... uniquement si pas d'inhibition, pas d'away, et pas d'ouverture prolongée.
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: schedule_changed
              - condition: trigger
                id: ha_start
              - condition: trigger
                id: automations_reloaded
          - condition: state
            entity_id: !input inhibition_helper
            state: "off"
          - condition: template
            value_template: "{{ not away_active }}"
          - condition: template
            value_template: >
              {% set is_open = is_state(door_sensor, 'on') %}
              {% if not is_open %}
                true
              {% else %}
                {% set since = (now() - states[door_sensor].last_changed).total_seconds() | int %}
                {{ since < (open_delay_minutes | int * 60) }}
              {% endif %}
        sequence:
          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: "{{ wanted_mode }}"
    default: []

mode: restart
