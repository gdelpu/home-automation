
blueprint:
  name: Fil pilote — Planification (Schedule) + Inhibition porte
  description: >
    Applique un mode de fil pilote selon un Schedule (ON/OFF), coupe le chauffage
    si la porte reste ouverte plus que le délai, et rétablit le mode à la fermeture.
  domain: automation
  source_url: https://example.local/blueprints/fil-pilote-planif-inhibition.yaml
  input:
    door_sensor:
      name: Capteur de porte
      description: Binary sensor (on = ouvert, off = fermé)
      selector:
        entity:
          domain: binary_sensor

    fil_pilote_select:
      name: Select du fil pilote (Nodon SIN-4-FP-21)
      selector:
        entity:
          domain: select

    schedule_entity:
      name: Schedule (helper)
      description: Entité du helper 'Schedule' (ON = mode ON, OFF = mode OFF)
      selector:
        entity:
          domain: schedule

    open_delay_minutes:
      name: Délai d'ouverture avant coupure
      description: Minutes d'ouverture continue de la porte avant de couper
      default: 2
      selector:
        number:
          min: 1
          max: 60
          step: 1
          mode: slider

    mode_when_on:
      name: Mode quand Schedule = ON
      description: Option exacte du select (ex. Comfort)
      default: "Comfort"
      selector:
        select:
          options:
            - "Comfort"
            - "Eco"
            - "Off"
            - "FrostProtection"
            - "ComfortMinus1"
            - "ComfortMinus2"

    mode_when_off:
      name: Mode quand Schedule = OFF
      description: Option exacte du select (ex. Eco)
      default: "Eco"
      selector:
        select:
          options:
            - "Comfort"
            - "Eco"
            - "Off"
            - "FrostProtection"
            - "ComfortMinus1"
            - "ComfortMinus2"

    off_mode_during_open:
      name: Mode forcé quand porte ouverte > délai
      description: Option exacte du select (ex. Off)
      default: "Off"
      selector:
        select:
          options:
            - "Off"
            - "Eco"
            - "Comfort"
            - "FrostProtection"
            - "ComfortMinus1"
            - "ComfortMinus2"

variables:
  door_sensor: !input door_sensor
  fil_pilote_select: !input fil_pilote_select
  schedule_entity: !input schedule_entity
  open_delay_minutes: !input open_delay_minutes
  mode_when_on: !input mode_when_on
  mode_when_off: !input mode_when_off
  off_mode_during_open: !input off_mode_during_open

trigger:
  - id: schedule_changed
    platform: state
    entity_id: !input schedule_entity
  - id: door_open_long
    platform: state
    entity_id: !input door_sensor
    to: "on"
    for:
      minutes: !input open_delay_minutes
  - id: door_closed
    platform: state
    entity_id: !input door_sensor
    to: "off"
  - id: ha_start
    platform: homeassistant
    event: start
  - id: automations_reloaded
    platform: event
    event_type: automation_reloaded

condition: []

action:
  - choose:
      # 1) Porte ouverte > délai → forcer le mode 'off_mode_during_open'
      - conditions:
          - condition: trigger
            id: door_open_long
        sequence:
          - service: select.select_option
            target:
              entity_id: !input fil_pilote_select
            data:
              option: "{{ off_mode_during_open }}"

      # 2) Porte refermée → réappliquer le mode du Schedule
      - conditions:
          - condition: trigger
            id: door_closed
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input schedule_entity
                    state: "on"
                sequence:
                  - service: select.select_option
                    target:
                      entity_id: !input fil_pilote_select
                    data:
                      option: "{{ mode_when_on }}"
              - conditions:
                  - condition: state
                    entity_id: !input schedule_entity
                    state: "off"
                sequence:
                  - service: select.select_option
                    target:
                      entity_id: !input fil_pilote_select
                    data:
                      option: "{{ mode_when_off }}"
            default: []

      # 3) Schedule change / HA start / reload → appliquer le mode
      #    ... mais seulement si la porte n'est PAS ouverte depuis plus que le délai.
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: schedule_changed
              - condition: trigger
                id: ha_start
              - condition: trigger
                id: automations_reloaded
          - condition: template
            value_template: >
              {% set is_open = is_state(door_sensor, 'on') %}
              {% if not is_open %}
                true
              {% else %}
                {# On compare la durée d'ouverture courante au délai #}
                {% set since = (now() - states[door_sensor].last_changed).total_seconds() | int %}
                {{ since < (open_delay_minutes | int * 60) }}
              {% endif %}
        sequence:
          - choose:
              - conditions:
                  - condition: state
                    entity_id: !input schedule_entity
                    state: "on"
                sequence:
                  - service: select.select_option
                    target:
                      entity_id: !input fil_pilote_select
                    data:
                      option: "{{ mode_when_on }}"
              - conditions:
                  - condition: state
                    entity_id: !input schedule_entity
                    state: "off"
                sequence:
                  - service: select.select_option
                    target:
                      entity_id: !input fil_pilote_select
                    data:
                      option: "{{ mode_when_off }}"
            default: []

mode: restart
